# Server HTTP locale, raggiungibile solo da questo computer.
#
#   docker compose -f docker-compose.http.yml up -d
#   endpoint: http://127.0.0.1:8000/mcp
#
# Il login si fa una volta con il comando `--login --login-viewer` del README;
# la sessione resta in ~/.linkedin-mcp. MCP_AUTH_TOKEN e' facoltativo: senza,
# nessuna chiave e' richiesta, che va bene finche' la porta resta su 127.0.0.1.
services:
  linkedin-mcp:
    image: stickerdaniel/linkedin-mcp-server:4.29.0
    restart: unless-stopped
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ~/.linkedin-mcp:/home/pwuser/.linkedin-mcp
    environment:
      - LOG_LEVEL=WARNING
      - MCP_AUTH_TOKEN
